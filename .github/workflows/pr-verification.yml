name: PR verification

# The full multiplatform/emulator matrix lives in integration-build-test.yml and stays manual
# because it is too slow to run on every push. This workflow is the fast subset that must never
# regress: diff hygiene, the tests that run without an emulator, and the public API gate.
# Compose screenshot validation is the other automatic PR check and lives in screenshot-test.yml,
# which needs a macOS runner.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBRARY_MODULE: ":pickers"
  SAMPLE_MODULE: ":sample"

jobs:
  repository-hygiene:
    name: Linux • Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"

  tests:
    name: Linux • Unit and Robolectric tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-37.0" \
                     "build-tools;37.0.0"
          yes | sdkmanager --licenses

      # Screenshot validation is not here: it runs in screenshot-test.yml, which uses a macOS
      # runner because the reference images only reproduce on a host that renders like the one
      # that recorded them. See docs/testing/compose-screenshot-tests.md.
      - name: Gradle Test • Desktop and Robolectric
        run: |
          ./gradlew \
            ${{ env.LIBRARY_MODULE }}:desktopTest \
            ${{ env.LIBRARY_MODULE }}:testDebugUnitTest \
            ${{ env.SAMPLE_MODULE }}:compileDebugKotlinAndroid \
            --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports
          path: pickers/build/reports/tests/**
          if-no-files-found: ignore

  public-api:
    name: macOS • Public API (ABI) gate
    # The klib dump covers the iOS targets, so this cannot run on Linux.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-37.0" \
                     "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Gradle Check • Kotlin ABI
        run: |
          ./gradlew \
            ${{ env.LIBRARY_MODULE }}:checkKotlinAbi \
            --no-daemon
